[pytest]
# Feature-vector parity test (no running stack needed):
#     python -m pytest central_responder_service/training/test_feature_parity.py
#
# Full suite (e2e smoke needs the docker stack up):
#     python -m pytest
testpaths =
    central_responder_service/training/test_feature_parity.py
    context_engine_service/tests
    api_service/tests
    persistence_service/tests
    tests
asyncio_mode = auto
addopts = --import-mode=importlib
markers =
    e2e: end-to-end test requiring the running docker stack
