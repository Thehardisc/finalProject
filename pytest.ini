[pytest]
# All tests live under qa_suite/:
#   qa_suite/unit/         — service unit tests (parity, context, api, persistence)
#   qa_suite/test_*.py     — ML-quality batteries (functional, invariants, sarcasm, ...)
#   qa_suite/test_e2e_smoke.py + test_live.py — @e2e, need the docker stack
#
# Fast parity check only:   python -m pytest qa_suite/unit/test_feature_parity.py
# Everything:               python -m pytest
testpaths =
    qa_suite
asyncio_mode = auto
# Default run excludes the big opt-in batteries; run_qa.sh profiles pass their
# own -m which overrides this.
addopts = --import-mode=importlib -m "not slow"
markers =
    e2e: end-to-end test requiring the running docker stack
