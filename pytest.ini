[pytest]
# Feature-vector parity is the #1 invariant of the system (CLAUDE.md): the live
# inference builder (ml/predictor.py:build_feature_vector) and the training builder
# (trainer/preprocessor.py:build_fv) MUST produce identical 103-dim vectors. The
# parity test guards that and runs without the heavy ML runtime deps.
#
#   Fast invariant check (no running stack needed):
#     python -m pytest central_responder_service/training/test_feature_parity.py
#
#   Full suite (e2e smoke needs the docker stack up):
#     python -m pytest
testpaths =
    central_responder_service/training/test_feature_parity.py
    context_engine_service/tests
    api_service/tests
    persistence_service/tests
    tests
asyncio_mode = auto
addopts = --import-mode=importlib
markers =
    e2e: end-to-end test requiring the running docker stack