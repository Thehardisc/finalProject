services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      sh -c "redis-server
      $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - emotion_net

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: emotion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - emotion_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d emotion_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion_service:
    build:
      context: .
      dockerfile: ingestion_service/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:5173},http://localhost:5173,http://localhost,http://127.0.0.1:5173,http://127.0.0.1
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: ingestion_service
      LOG_DIR: /app/logs
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - ./logs/live:/app/logs

  preprocessing_service:
    build:
      context: .
      dockerfile: preprocessing_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: preprocessing_service
      LOG_DIR: /app/logs
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - ./logs/live:/app/logs

  vader_service:
    build:
      context: .
      dockerfile: vader_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: vader_service
      LOG_DIR: /app/logs
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - ./logs/live:/app/logs

  goemotions_service:
    build:
      context: .
      dockerfile: goemotions_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: goemotions_service
      LOG_DIR: /app/logs
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./logs/live:/app/logs
      # Model dir so the service picks up samlowe_finetuned when the trainer
      # produces it (no-op until then).
      - ./.cache:/app/models


  bert_service:
    build:
      context: .
      dockerfile: bert_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: bert_service
      LOG_DIR: /app/logs
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - hf_cache:/root/.cache/huggingface
      - ./logs/live:/app/logs

  central_responder_service:
    build:
      context: .
      dockerfile: central_responder_service/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
      context_engine_service:
        condition: service_healthy
      trainer_service:
        condition: service_started
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      MODEL_PATH: ${MODEL_PATH:-/app/models/meta_weights.pkl}
      TRAINER_EXTERNAL: "true"
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: central_responder_service
      LOG_DIR: /app/logs
      TZ: ${TZ:-Asia/Jerusalem}
      IMPLICIT_EMOTION_ENABLED: ${IMPLICIT_EMOTION_ENABLED:-true}
      IMPLICIT_TIMEOUT_MS: ${IMPLICIT_TIMEOUT_MS:-300}
      IMPLICIT_MIN_WORDS: ${IMPLICIT_MIN_WORDS:-4}
      IMPLICIT_GOE_NEUTRAL_CAP: ${IMPLICIT_GOE_NEUTRAL_CAP:-0.90}
      IMPLICIT_LOW_CONF_THRESHOLD: ${IMPLICIT_LOW_CONF_THRESHOLD:-0.42}
      IMPLICIT_LOW_CONF_MARGIN: ${IMPLICIT_LOW_CONF_MARGIN:-0.10}
      IMPLICIT_CONF_THRESHOLD: ${IMPLICIT_CONF_THRESHOLD:-0.50}
      OPTIONAL_TIMEOUT_MS: ${OPTIONAL_TIMEOUT_MS:-1000}
    volumes:
      - ./.cache:/app/models
      - hf_cache:/root/.cache/huggingface
      - ./logs/live:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:9090/metrics', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  trainer_service:
    build:
      context: .
      dockerfile: central_responder_service/Dockerfile
    restart: on-failure
    command: ["python", "-m", "trainer"]
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      RETRAIN_INTERVAL_SECONDS: ${RETRAIN_INTERVAL_SECONDS:-1800}
      ACCURACY_GATE: ${ACCURACY_GATE:-0.40}
      MAX_EMPATHETIC_SAMPLES: ${MAX_EMPATHETIC_SAMPLES:-25000}
      MIN_DB_SAMPLES: ${MIN_DB_SAMPLES:-50}
      MODEL_PATH: ${MODEL_PATH:-/app/models/meta_weights.pkl}
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-emotion_db}
      HF_DATASETS_OFFLINE: "0"
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: trainer_service
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_DIR: /app/logs
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - ./.cache:/app/models
      - ./conversation_state_learner/training_data:/app/training_data:ro
      - hf_cache:/root/.cache/huggingface
      - ./logs/live:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1 2>/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  llm_reasoning_service:
    build:
      context: .
      dockerfile: llm_reasoning_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      LLM_PROVIDER: ${LLM_PROVIDER:-RULE_BASED}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_INSIGHT_MODEL: ${LLM_INSIGHT_MODEL:-claude-haiku-4-5-20251001}
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: llm_reasoning_service
      LOG_DIR: /app/logs
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - ./logs/live:/app/logs

  aggregation_service:
    build:
      context: .
      dockerfile: aggregation_service/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      CONVERSATION_IDLE_MINUTES: ${CONVERSATION_IDLE_MINUTES:-30}
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: aggregation_service
      LOG_DIR: /app/logs
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - ./logs/live:/app/logs

  persistence_service:
    build:
      context: .
      dockerfile: persistence_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      DB_HOST: db
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: persistence_service
      LOG_DIR: /app/logs
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - ./.cache:/app/models:ro
      - ./logs/live:/app/logs

  api_service:
    build:
      context: .
      dockerfile: api_service/Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      central_responder_service:
        condition: service_started
      aggregation_service:
        condition: service_started
      persistence_service:
        condition: service_started
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-emotion_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_DEMO_MODEL: ${AI_DEMO_MODEL:-claude-sonnet-5}
      ALLOWED_ORIGINS: ${FRONTEND_URL:-http://localhost:5173},http://localhost:5173,http://localhost,http://127.0.0.1:5173,http://127.0.0.1
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: api_service
      LOG_DIR: /app/logs
      TZ: ${TZ:-Asia/Jerusalem}
    volumes:
      - ./.cache:/app/models:ro
      - ./logs/live:/app/logs


  frontend_service:
    build:
      context: frontend_service
      args:
        VITE_API_URL: ${API_URL:-http://localhost:8001}
    ports:
      - "5173:80"
    depends_on:
      - api_service
    networks:
      - emotion_net

  qdrant:
    image: qdrant/qdrant:v1.7.0
    ports:
      - "6333:6333"
    networks:
      - emotion_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  context_engine_service:
    build:
      context: .
      dockerfile: context_engine_service/Dockerfile
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      TRAIN_HMM_ON_STARTUP: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: context_engine_service
      LOG_DIR: /app/logs
      TZ: ${TZ:-Asia/Jerusalem}
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - emotion_net
    volumes:
      - ./.cache:/app/models
      - ./logs/live:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  emotion_net:
    driver: bridge

volumes:
  postgres_data:
  hf_cache:  # Persists HuggingFace model downloads across container rebuilds
