services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: >
      sh -c "redis-server
      $${REDIS_PASSWORD:+--requirepass $$REDIS_PASSWORD}"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - emotion_net

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: emotion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - emotion_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d emotion_db" ]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion_service:
    build:
      context: .
      dockerfile: ingestion_service/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: ingestion_service

  preprocessing_service:
    build:
      context: .
      dockerfile: preprocessing_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: preprocessing_service

  vader_service:
    build:
      context: .
      dockerfile: vader_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: vader_service

  goemotions_service:
    build:
      context: .
      dockerfile: goemotions_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: goemotions_service
    volumes:
      - hf_cache:/root/.cache/huggingface


  bert_service:
    build:
      context: .
      dockerfile: bert_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: bert_service
    volumes:
      - hf_cache:/root/.cache/huggingface

  central_responder_service:
    build:
      context: .
      dockerfile: central_responder_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      context_engine_service:
        condition: service_healthy
      trainer_service:
        condition: service_started
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      MODEL_PATH: ${MODEL_PATH:-/app/models/meta_weights.pkl}
      TRAINER_EXTERNAL: "true"
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: central_responder_service
    volumes:
      - ./central_responder_service/models:/app/models
      - hf_cache:/root/.cache/huggingface

  trainer_service:
    build:
      context: .
      dockerfile: central_responder_service/Dockerfile
    command: ["python", "central_responder_service/trainer.py"]
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      RETRAIN_INTERVAL_SECONDS: ${RETRAIN_INTERVAL_SECONDS:-1800}
      ACCURACY_GATE: ${ACCURACY_GATE:-0.40}
      MAX_EMPATHETIC_SAMPLES: ${MAX_EMPATHETIC_SAMPLES:-25000}
      MIN_DB_SAMPLES: ${MIN_DB_SAMPLES:-50}
      MODEL_PATH: ${MODEL_PATH:-/app/models/meta_weights.pkl}
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-emotion_db}
      HF_DATASETS_OFFLINE: "0"
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: trainer_service
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./central_responder_service/models:/app/models
      - ./conversation_state_learner/training_data:/app/training_data:ro
      - hf_cache:/root/.cache/huggingface

  llm_reasoning_service:
    build:
      context: .
      dockerfile: llm_reasoning_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      LLM_PROVIDER: ${LLM_PROVIDER:-RULE_BASED}
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: llm_reasoning_service

  aggregation_service:
    build:
      context: .
      dockerfile: aggregation_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      CONVERSATION_IDLE_MINUTES: ${CONVERSATION_IDLE_MINUTES:-30}
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: aggregation_service

  persistence_service:
    build:
      context: .
      dockerfile: persistence_service/Dockerfile
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      DB_HOST: db
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: persistence_service
    volumes:
      - ./central_responder_service/models:/app/models:ro

  api_service:
    build:
      context: .
      dockerfile: api_service/Dockerfile
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
      central_responder_service:
        condition: service_started
      aggregation_service:
        condition: service_started
      persistence_service:
        condition: service_started
    networks:
      - emotion_net
    environment:
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      REDIS_PORT: 6379
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-60}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      DB_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-emotion_db}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRY_HOURS: ${JWT_EXPIRY_HOURS:-24}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: api_service
    volumes:
      - ./central_responder_service/models:/app/models:ro


  frontend_service:
    build:
      context: ./frontend_service
    ports:
      - "5173:80"
    depends_on:
      - api_service
    networks:
      - emotion_net

  qdrant:
    image: qdrant/qdrant:v1.7.0
    ports:
      - "6333:6333"
    networks:
      - emotion_net
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  context_engine_service:
    build:
      context: .
      dockerfile: context_engine_service/Dockerfile
    environment:
      REDIS_HOST: redis
      QDRANT_HOST: qdrant
      TRAIN_HMM_ON_STARTUP: "true"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-TEXT}
      PYTHONUNBUFFERED: "1"
      SERVICE_NAME: context_engine_service
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - emotion_net
    volumes:
      - ./central_responder_service/models:/app/models
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8008/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

networks:
  emotion_net:
    driver: bridge

volumes:
  postgres_data:
  hf_cache:  # Persists HuggingFace model downloads across container rebuilds
